name: Build

on:
  push:
    branches:
      - fix/macos27-hide-mechanism
      - develop
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build (Release, unsigned)
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -p

      - name: Build
        run: |
          xcodebuild \
            -project "Hidden Bar.xcodeproj" \
            -scheme "Hidden Bar" \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=YES \
            build

      - name: Upload app artifact
        uses: actions/upload-artifact@v4
        with:
          name: Hidden-Bar-macOS27-fix
          path: build/Build/Products/Release/Hidden Bar.app
          if-no-files-found: error
